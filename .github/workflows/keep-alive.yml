name: Mantener Supabase despierto

# Corre cada 2 dias a las 12:00 UTC (09:00 hora Chile)
# y tambien se puede ejecutar a mano desde la pestaña Actions
on:
  schedule:
    - cron: '0 12 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        run: |
          RESPUESTA=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://amaqpjawhtgswlrcudsw.supabase.co/rest/v1/lab_datos?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "Codigo de respuesta: $RESPUESTA"

          if [ "$RESPUESTA" = "200" ]; then
            echo "Base de datos activa. Ping exitoso."
          else
            echo "La base no respondio correctamente (codigo $RESPUESTA)."
            exit 1
          fi
